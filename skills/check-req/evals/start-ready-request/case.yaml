schema_version: "1.1"
name: start-ready-request
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The workspace (scenario start) holds REQ-0001, a ready feature on SSLib whose spec adds greeting.txt with the line
  'Hello from SSLib'. The agent starts it: a worktree under .claude/worktrees/, the start commit on the request branch
  (status in-progress, branch and project-branch set), the SSLib branch feat/add-greeting from origin/develop, SSDisp
  detached at its gitlink. It implements the file, runs bash build.sh in SSLib, writes the implementation summary,
  marks the request for review with the gitlink of SSLib, pushes every branch (push-policy auto), removes the worktrees,
  and leaves the root checkout on develop and clean. Project commits never mention the request.
  When the agent asks the developer anything, the developer accepts the recommended option.
