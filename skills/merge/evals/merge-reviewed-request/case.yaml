schema_version: "1.1"
name: merge-reviewed-request
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The workspace (scenario merge-review) holds REQ-0001, in review on feat/REQ-0001-add-greeting, with a passed Verify and Review
  in its Notes; SSLib's feat/add-greeting adds greeting.txt; the root checkout is on develop. The agent merges SSLib first
  (--no-ff into develop, project-style message without the request id), then closes the request on the workspace branch
  (chore(reqs): close REQ-0001, status done, moved to reqs/done, gitlink = the SSLib merge commit), merges the workspace
  branch into develop (--no-ff, Refs: REQ-0001), pushes both, deletes the branches, and leaves the root checkout on develop.
  When the agent asks the developer anything, the developer accepts the recommended option.
