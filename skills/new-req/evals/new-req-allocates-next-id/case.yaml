  carries the id only in its request file. The agent must find that the highest id in use is REQ-0006 and open feat/REQ-0007-<slug> from develop, commit and push the
  draft (reserving the id), read SSLib's build.sh at the latest develop commit and record it as verified evidence, write a complete spec (all parts, no program
