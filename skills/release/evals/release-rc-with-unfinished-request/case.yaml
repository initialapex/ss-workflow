schema_version: "1.1"
name: release-rc-with-unfinished-request
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The workspace (scenario release-rc) has SSLib (version-source version.txt) with a closed REQ-0001, two commits on develop since v0.1.0, and
  REQ-0002 in progress. The agent opens release/v0.2.0 from SSLib's develop, shows the unfinished REQ-0002 and asks what to
  do, sets version.txt to the release candidate version in its own commit, builds, tags v0.2.0-rc1 on the release branch,
  asks before pushing the tag, pushes the branch and the tag, puts SSLib back at its gitlink, makes no workspace tag, and
  reports REQ-0002 as not part of this release. When the agent asks the developer anything, the developer chooses 'Release
  without them' and agrees to push the tag.
